<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Neon Dashers</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game" aria-label="Neon Dashers game"></canvas>

  <div id="hud">
    <div id="progressWrap"><div id="progress"></div></div>
    <div id="percent">0%</div>
  </div>

  <div id="menu" class="panel">
    <h1>NEON<br><span>DASHERS</span></h1>
    <p class="tagline">A rhythm platform challenge</p>
    <button id="playButton" class="primary">PLAY</button>
    <div class="controls">CLICK, TAP, or SPACE to jump</div>
  </div>

  <div id="complete" class="panel hidden">
    <h2>LEVEL COMPLETE!</h2>
    <div id="finalPercent">100%</div>
    <button id="againButton" class="primary">PLAY AGAIN</button>
  </div>

  <script src="game.js"></script>
</body>
</html>
